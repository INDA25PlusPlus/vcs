[package]
name = "vcs-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vcs"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
vcs-core = { workspace = true }
